<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DaveOS — Girlfriend Day Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050505;
  --panel: rgba(8,12,9,0.86);
  --green:#3dff7a;
  --green-soft:#8fffb0;
  --green-dim:#155c2c;
  --green-glow: rgba(61,255,122,0.45);
  --cyan:#6bf0e6;
  --red:#ff4b4b;
  --amber:#ffc06a;
  --gold:#e8c07d;
  --plum1:#170710;
  --plum2:#3a1128;
  --plum3:#5e1c3d;
  --paper:#fbf3e7;
  --ink:#3c2a1e;
  --mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  --serif: 'Cormorant Garamond', Georgia, serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{
  margin:0; padding:0; height:100%;
  background:var(--void);
  overscroll-behavior:none;
}
body{
  font-family:var(--mono);
  color:var(--green);
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
}

/* ---------- background matrix canvas ---------- */
#matrix-bg{
  position:fixed; inset:0; width:100%; height:100%;
  z-index:0; opacity:0.16; pointer-events:none;
}
#vignette{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%);
}

/* ---------- start / lock screen ---------- */
#start-screen{
  position:fixed; inset:0; z-index:50;
  background:var(--void);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px; gap:18px;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#start-screen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
.start-title{
  font-size:clamp(1.1rem,5vw,1.6rem);
  letter-spacing:0.06em;
  color:var(--green);
  text-shadow:0 0 12px var(--green-glow);
}
.start-sub{
  font-size:clamp(0.75rem,3.4vw,0.9rem);
  color:var(--green-dim);
  max-width:320px;
  line-height:1.6;
}
.start-btn{
  margin-top:10px;
  font-family:var(--mono);
  background:transparent;
  border:1px solid var(--green);
  color:var(--green);
  padding:14px 28px;
  font-size:0.95rem;
  letter-spacing:0.08em;
  border-radius:4px;
  cursor:pointer;
  box-shadow:0 0 18px rgba(61,255,122,0.15) inset, 0 0 12px rgba(61,255,122,0.15);
  animation:pulseGlow 2.2s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{ box-shadow:0 0 8px rgba(61,255,122,0.15) inset, 0 0 8px rgba(61,255,122,0.15);}
  50%{ box-shadow:0 0 20px rgba(61,255,122,0.35) inset, 0 0 22px rgba(61,255,122,0.35);}
}
.blinking-caret{ display:inline-block; width:0.5em; animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }

/* ---------- terminal window ---------- */
#app{
  position:relative; z-index:2;
  width:100%; max-width:640px;
  height:100vh;
  height:100dvh;
  min-height:0;
  display:flex; flex-direction:column;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
}
#terminal-window{
  flex:1;
  min-height:0;
  display:flex; flex-direction:column;
  background:var(--panel);
  border:1px solid var(--green-dim);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(61,255,122,0.06);
  backdrop-filter: blur(6px);
  transition: opacity 0.6s ease, filter 0.6s ease;
}
#terminal-window.crashing{ animation: glitchShake 0.35s steps(2) infinite; }
@keyframes glitchShake{
  0%{ transform:translate(0,0); filter:hue-rotate(0deg); }
  25%{ transform:translate(-2px,1px); }
  50%{ transform:translate(2px,-1px); filter:hue-rotate(20deg); }
  75%{ transform:translate(-1px,-1px); }
  100%{ transform:translate(0,0); filter:hue-rotate(0deg); }
}
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--green-dim);
  background:rgba(0,0,0,0.35);
  flex-shrink:0;
}
.dots{ display:flex; gap:6px; }
.dot{ width:10px; height:10px; border-radius:50%; opacity:0.85; }
.dot.r{ background:#ff5f56; } .dot.y{ background:#ffbd2e; } .dot.g{ background:#27c93f; }
.topbar-title{
  flex:1; text-align:center;
  font-size:0.72rem; letter-spacing:0.04em;
  color:var(--green-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

#terminal-body{
  flex:1; min-height:0; overflow-y:auto;
  padding:20px 18px 28px;
  font-size:clamp(0.86rem,3.6vw,1rem);
  line-height:1.7;
  -webkit-overflow-scrolling:touch;
}
#terminal-body::-webkit-scrollbar{ width:5px; }
#terminal-body::-webkit-scrollbar-thumb{ background:var(--green-dim); border-radius:3px; }

.line{ margin:0 0 4px 0; text-shadow:0 0 5px rgba(61,255,122,0.28); white-space:pre-wrap; word-wrap:break-word; }
.line.cyan{ color:var(--cyan); text-shadow:0 0 5px rgba(107,240,230,0.35); }
.line.dim{ color:var(--green-dim); text-shadow:none; }
.line.red{ color:var(--red); text-shadow:0 0 6px rgba(255,75,75,0.4); }
.line.amber{ color:var(--amber); text-shadow:0 0 5px rgba(255,192,106,0.35); }
.line.center{ text-align:center; }
.line.big{ font-size:1.15em; font-weight:600; }
.line.prompt::before{ content:"root@heart:~$ "; color:var(--green-dim); }

.cursor{ display:inline-block; width:0.5em; height:1em; background:var(--green); vertical-align:text-bottom; margin-left:1px; animation:blink 0.9s steps(1) infinite; box-shadow:0 0 6px var(--green-glow); }

.gap{ height:10px; }
.gap-lg{ height:22px; }

/* ---------- generic interactive controls ---------- */
.btn-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.btn{
  font-family:var(--mono);
  background:transparent;
  color:var(--green);
  border:1px solid var(--green);
  padding:11px 18px;
  border-radius:5px;
  font-size:0.85rem;
  letter-spacing:0.03em;
  cursor:pointer;
  transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.btn:hover{ background:rgba(61,255,122,0.08); }
.btn:active{ transform:scale(0.96); }
.btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.btn.primary{ box-shadow:0 0 16px rgba(61,255,122,0.2); }
.btn.ghost{ border-color:var(--green-dim); color:var(--green-dim); }
.btn.danger{ border-color:var(--red); color:var(--red); }
.btn:disabled{ opacity:0.35; cursor:not-allowed; }

.text-input{
  font-family:var(--mono);
  background:rgba(0,0,0,0.4);
  border:1px solid var(--green-dim);
  color:var(--green);
  padding:12px 14px;
  border-radius:5px;
  font-size:0.95rem;
  width:100%;
  margin-top:12px;
}
.text-input:focus{ outline:none; border-color:var(--green); box-shadow:0 0 10px rgba(61,255,122,0.2); }
.text-input::placeholder{ color:var(--green-dim); }

.hint{ font-size:0.78rem; color:var(--green-dim); margin-top:8px; }

/* tap to continue affordance */
.tap-continue{
  margin-top:16px; text-align:center;
  font-size:0.78rem; color:var(--green-dim);
  letter-spacing:0.08em;
  animation:fadeInSlow 1s ease;
}

@keyframes fadeInSlow{ from{opacity:0;} to{opacity:1;} }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.enter{ animation:fadeIn 0.5s ease both; }

/* ---------- glassmorphism modal (hidden files) ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:40;
  background:rgba(0,0,0,0.55);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  opacity:0; pointer-events:none;
  transition:opacity 0.3s ease;
}
.modal-overlay.show{ opacity:1; pointer-events:auto; }
.modal-card{
  width:100%; max-width:440px;
  background:rgba(20,28,22,0.55);
  border:1px solid rgba(61,255,122,0.35);
  border-radius:14px;
  padding:22px 20px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  transform:translateY(14px) scale(0.98);
  transition:transform 0.35s ease;
}
.modal-overlay.show .modal-card{ transform:translateY(0) scale(1); }
.modal-title{ color:var(--cyan); font-size:0.95rem; letter-spacing:0.05em; margin-bottom:10px; }
.modal-body{ font-size:0.88rem; line-height:1.75; color:var(--green-soft); }
.modal-close{ margin-top:16px; }

/* ---------- folder grid ---------- */
.folder-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
@media (min-width:420px){ .folder-grid{ grid-template-columns:1fr 1fr; } }
.folder{
  background:rgba(61,255,122,0.05);
  border:1px solid var(--green-dim);
  border-radius:8px;
  padding:16px 10px;
  text-align:center;
  cursor:pointer;
  font-size:0.78rem;
  transition:background 0.2s ease, border-color 0.2s ease;
}
.folder .ic{ font-size:1.6rem; display:block; margin-bottom:6px; }
.folder:active{ transform:scale(0.97); }
.folder.opened{ border-color:var(--cyan); color:var(--cyan); }

/* ---------- command bar ---------- */
#command-bar{
  flex-shrink:0;
  display:flex; align-items:center; gap:8px;
  border-top:1px solid var(--green-dim);
  background:rgba(0,0,0,0.45);
  padding:10px 12px;
  opacity:0; max-height:0; overflow:hidden;
  transition:opacity 0.4s ease, max-height 0.4s ease, padding 0.4s ease;
}
#command-bar.visible{ opacity:1; max-height:60px; padding:10px 12px; }
#command-bar .prefix{ color:var(--green-dim); font-size:0.85rem; white-space:nowrap; }
#command-input{
  flex:1; background:transparent; border:none; color:var(--green);
  font-family:var(--mono); font-size:0.85rem; outline:none;
}

/* ---------- toast ---------- */
#toast-layer{ position:fixed; inset:0; z-index:60; pointer-events:none; }
.toast{
  position:absolute; left:50%; top:16%;
  transform:translate(-50%,-10px);
  background:rgba(10,14,11,0.9);
  border:1px solid var(--cyan);
  color:var(--cyan);
  padding:10px 18px; border-radius:8px;
  font-size:0.85rem;
  box-shadow:0 0 24px rgba(107,240,230,0.25);
  opacity:0;
  transition:opacity 0.35s ease, transform 0.35s ease;
  white-space:nowrap;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- puzzle: heart shards ---------- */
.puzzle-wrap{ position:relative; height:280px; margin-top:14px; border:1px dashed var(--green-dim); border-radius:10px; overflow:hidden; }
.puzzle-target{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-size:64px; opacity:0.18; filter:grayscale(1);
  transition:opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
  user-select:none;
}
.puzzle-target.filled{ opacity:1; filter:none; transform:translate(-50%,-50%) scale(1.15); }
.shard{
  position:absolute; font-size:30px; cursor:grab;
  touch-action:none; user-select:none;
  filter:drop-shadow(0 0 6px rgba(255,75,110,0.4));
  transition:filter 0.2s ease;
}
.shard.placed{ opacity:0; pointer-events:none; }
.puzzle-status{ text-align:center; font-size:0.8rem; color:var(--green-dim); margin-top:8px; }

/* ---------- memory match ---------- */
.mem-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:16px; }
.mem-card{
  aspect-ratio:1/1.15;
  background:rgba(61,255,122,0.06);
  border:1px solid var(--green-dim);
  border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem;
  cursor:pointer;
  position:relative;
  perspective:600px;
}
.mem-inner{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; transition:transform 0.4s ease; transform-style:preserve-3d; }
.mem-card.flipped .mem-inner, .mem-card.matched .mem-inner{ transform:rotateY(180deg); }
.mem-face{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; border-radius:6px; }
.mem-back{ color:var(--green-dim); font-size:1rem; }
.mem-front{ transform:rotateY(180deg); }
.mem-card.matched{ border-color:var(--cyan); opacity:0.85; }

/* ---------- range / blur photo ---------- */
.photo-frame{
  margin-top:14px; height:200px; border-radius:10px; overflow:hidden;
  border:1px solid var(--green-dim);
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 40% 30%, #241033, #0c0410 70%);
  position:relative;
}
.photo-svg{ transition:filter 0.15s ease; filter:blur(18px); }
.range-input{ width:100%; margin-top:14px; accent-color:var(--cyan); }

/* ---------- progress / scan bars ---------- */
.scan-row{ margin-top:14px; }
.scan-label{ display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:5px; }
.scan-track{ height:9px; background:rgba(61,255,122,0.08); border:1px solid var(--green-dim); border-radius:5px; overflow:hidden; }
.scan-fill{ height:100%; background:linear-gradient(90deg,var(--green-dim),var(--green)); width:0%; transition:width 1.1s cubic-bezier(.2,.7,.3,1); box-shadow:0 0 8px var(--green-glow); }
.scan-fill.overflow{ background:linear-gradient(90deg,var(--amber),var(--red)); }
.scan-fill.frozen{ background:repeating-linear-gradient(45deg,var(--red),var(--red) 6px, #7a1414 6px,#7a1414 12px); }

/* ---------- ownership / crown ---------- */
.crown-wrap{ text-align:center; margin-top:18px; font-size:2.4rem; animation:floatUp 2.4s ease-in-out infinite; }
@keyframes floatUp{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }

/* ---------- final letter scene ---------- */
#letter-scene{
  position:fixed; inset:0; z-index:30;
  background: radial-gradient(ellipse at 50% 20%, var(--plum3) 0%, var(--plum2) 45%, var(--plum1) 100%);
  display:flex; align-items:flex-start; justify-content:center;
  padding:0; opacity:0; pointer-events:none;
  transition:opacity 1.4s ease;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#letter-scene.show{ opacity:1; pointer-events:auto; }
.petal-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
.petal{ position:absolute; top:-5%; font-size:1.1rem; opacity:0.55; animation:fall linear infinite; }
@keyframes fall{ to{ transform:translateY(115vh) rotate(360deg); } }
.letter-wrap{
  position:relative; z-index:2;
  max-width:560px; width:100%;
  margin:0 auto;
  padding:56px 26px 90px;
  font-family:var(--serif);
  color:var(--paper);
}
.letter-wrap h2{
  font-weight:500; font-style:italic; font-size:clamp(1.3rem,5vw,1.7rem);
  color:var(--gold); text-align:center; margin:0 0 30px;
  letter-spacing:0.02em;
}
.letter-line{ font-size:clamp(1.05rem,4.4vw,1.28rem); line-height:1.85; margin:0 0 14px; text-shadow:none; color:var(--paper); }
.letter-line.sign{ text-align:right; font-style:italic; color:var(--gold); margin-top:26px; }
.letter-cursor{ display:inline-block; width:0.4em; height:1em; background:var(--gold); vertical-align:text-bottom; animation:blink 0.9s steps(1) infinite; }

.status-box{
  margin-top:40px; border:1px solid rgba(232,192,125,0.4); border-radius:10px;
  padding:18px 20px; background:rgba(0,0,0,0.2);
  font-family:var(--mono); font-size:0.82rem; color:var(--gold); line-height:2;
}
.status-box .k{ color:rgba(251,243,231,0.6); }

.letter-continue{
  display:block; margin:34px auto 0; font-family:var(--serif); font-style:italic;
  background:transparent; border:1px solid var(--gold); color:var(--gold);
  padding:10px 22px; border-radius:20px; font-size:1rem; cursor:pointer;
  opacity:0; transition:opacity 1s ease;
}
.letter-continue.show{ opacity:1; }

/* ---------- notification banner (secret ending) ---------- */
.notif{
  position:fixed; left:50%; top:8%; transform:translate(-50%,-140%);
  width:88%; max-width:380px;
  background:rgba(15,18,16,0.92); border:1px solid var(--cyan);
  border-radius:14px; padding:14px 16px; z-index:70;
  box-shadow:0 10px 40px rgba(0,0,0,0.6), 0 0 20px rgba(107,240,230,0.2);
  transition:transform 0.6s cubic-bezier(.17,.89,.32,1.28);
  cursor:pointer;
}
.notif.show{ transform:translate(-50%,0); }
.notif-title{ font-size:0.72rem; color:var(--cyan); letter-spacing:0.05em; margin-bottom:4px; }
.notif-body{ font-size:0.86rem; color:var(--green-soft); }

/* ---------- mute + fullscreen fade ---------- */
#mute-btn{
  position:fixed; top:max(10px,env(safe-area-inset-top)); right:10px; z-index:55;
  background:rgba(0,0,0,0.5); border:1px solid var(--green-dim); color:var(--green-dim);
  border-radius:20px; padding:6px 12px; font-family:var(--mono); font-size:0.72rem; cursor:pointer;
}
#screen-fade{
  position:fixed; inset:0; background:#000; z-index:80; opacity:0; pointer-events:none; transition:opacity 1.1s ease;
}
#screen-fade.show{ opacity:1; pointer-events:auto; }

.center-emoji{ text-align:center; font-size:2.4rem; margin:14px 0; }
.small{ font-size:0.78rem; }
.italic{ font-style:italic; }

#replay-wrap{ text-align:center; padding:26px 0 10px; opacity:0; transition:opacity 1.5s ease; }
#replay-wrap.show{ opacity:1; }
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>
<div id="vignette"></div>
<div id="screen-fade"></div>

<div id="start-screen">
  <div class="start-title">DAVEOS</div>
  <div class="start-sub">A private system. Encrypted. Waiting for one specific person.<br><br>Tap to power on.</div>
  <button class="start-btn" id="power-btn">[ POWER ON ]<span class="blinking-caret">_</span></button>
</div>

<button id="mute-btn">🔊 sound</button>

<div id="app">
  <div id="terminal-window">
    <div class="topbar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="topbar-title" id="topbar-title">root@heart:~$ ./daveos --edition=girlfriend-day</div>
      <div style="width:40px"></div>
    </div>
    <div id="terminal-body"></div>
    <div id="command-bar">
      <span class="prefix">root@heart:~$</span>
      <input id="command-input" class="text-input" style="margin:0;border:none;padding:0;background:transparent" placeholder="type a hidden command..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
</div>

<div id="letter-scene">
  <div class="petal-layer" id="petal-layer"></div>
  <div class="letter-wrap" id="letter-wrap"></div>
</div>

<div id="toast-layer"></div>
<audio id="bg-song" preload="none" loop src="song.mp3"></audio>

<script>
/* ============================================================
   DaveOS — Girlfriend Day Edition
   ============================================================ */

/* ---------------- state ---------------- */
const state = {
  muted:false,
  audioCtx:null,
  name:'',
  foldersOpened:0,
  commandsUnlocked:false,
  photoViews:1204,
  ambientNodes:null
};

/* ---------------- basic helpers ---------------- */
const termBody = document.getElementById('terminal-body');
function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }
function makeButton(label, cls){ const b=document.createElement('button'); b.className=cls||'btn primary'; b.textContent=label; return b; }
function wrapCenter(node){ const d=document.createElement('div'); d.style.textAlign='center'; d.style.marginTop='16px'; d.appendChild(node); return d; }
function addRaw(node){ termBody.appendChild(node); termBody.scrollTop = termBody.scrollHeight; return node; }
function addGap(big){ const d=document.createElement('div'); d.className= big?'gap-lg':'gap'; termBody.appendChild(d); }
function waitForClick(node){
  return new Promise(resolve=>{
    function h(){ node.removeEventListener('click',h); resolve(); }
    node.addEventListener('click', h);
  });
}
function waitForEither(a,b){
  return new Promise(resolve=>{
    function ha(){ cleanup(); resolve('a'); }
    function hb(){ cleanup(); resolve('b'); }
    function cleanup(){ a.removeEventListener('click',ha); b.removeEventListener('click',hb); }
    a.addEventListener('click',ha); b.addEventListener('click',hb);
  });
}
function makeTextPrompt(placeholder, label){
  const wrap=document.createElement('div');
  const input=document.createElement('input');
  input.className='text-input'; input.placeholder=placeholder; input.autocomplete='off';
  input.autocapitalize='off'; input.spellcheck=false;
  const btn=makeButton(label||'[ Submit ]'); btn.style.marginTop='10px';
  wrap.appendChild(input); wrap.appendChild(document.createElement('br')); wrap.appendChild(btn);
  addRaw(wrap);
  return {input,btn,wrap};
}

/* ---------------- typewriter ---------------- */
let skipRequested = false;
termBody.addEventListener('click', ()=>{ skipRequested = true; });

function typeLine(text, opts){
  opts = opts || {};
  const cls = opts.cls || '';
  const speed = opts.speed || 22;
  const container = opts.container || termBody;
  const cursorCls = opts.cursorCls || 'cursor';
  const noSkip = !!opts.noSkip;
  const doTick = opts.tick !== false;
  return new Promise(resolve=>{
    const p = document.createElement('div');
    p.className = ('line ' + cls + ' enter').trim().replace(/\s+/g,' ');
    const textNode = document.createElement('span');
    const cursor = document.createElement('span'); cursor.className = cursorCls;
    p.appendChild(textNode); p.appendChild(cursor);
    container.appendChild(p);
    container.scrollTop = container.scrollHeight;
    let i = 0;
    function step(){
      if(!noSkip && skipRequested){
        textNode.textContent = text;
        cursor.remove();
        skipRequested = false;
        container.scrollTop = container.scrollHeight;
        resolve();
        return;
      }
      if(i < text.length){
        textNode.textContent += text[i];
        i++;
        if(doTick && i % 2 === 0) tick();
        container.scrollTop = container.scrollHeight;
        setTimeout(step, speed + Math.random()*14);
      } else {
        cursor.remove();
        resolve();
      }
    }
    step();
  });
}

/* ---------------- audio ---------------- */
function ensureAudio(){
  if(!state.audioCtx){
    try{ state.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(state.audioCtx && state.audioCtx.state === 'suspended'){ state.audioCtx.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(state.muted || !state.audioCtx) return;
  const ctx = state.audioCtx;
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = type||'sine'; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol||0.05, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.1));
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+(dur||0.1)+0.02);
}
function tick(){ beep(1700+Math.random()*500, 0.02, 'square', 0.018); }
function bootTone(){ beep(220,0.15,'sine',0.06); beep(440,0.15,'sine',0.05,0.12); }
function successTone(){ beep(523,0.09,'sine',0.06); beep(659,0.09,'sine',0.06,0.09); beep(784,0.14,'sine',0.06,0.18); }
function errorTone(){ beep(160,0.25,'sawtooth',0.06); beep(110,0.3,'sawtooth',0.05,0.08); }
function chimeTone(){ beep(880,0.2,'sine',0.05); beep(1108,0.25,'sine',0.045,0.12); }

function startAmbient(){
  if(state.muted || !state.audioCtx) return;
  const ctx = state.audioCtx;
  const notes = [261.63,329.63,392.00,523.25];
  const master = ctx.createGain();
  master.gain.setValueAtTime(0, ctx.currentTime);
  master.gain.linearRampToValueAtTime(0.03, ctx.currentTime+3);
  master.connect(ctx.destination);
  const oscs = notes.map(f=>{
    const o = ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    o.connect(master); o.start(); return o;
  });
  state.ambientNodes = {master, oscs};
}
function stopAmbient(){
  if(!state.ambientNodes || !state.audioCtx) return;
  const {master, oscs} = state.ambientNodes;
  const ctx = state.audioCtx;
  master.gain.linearRampToValueAtTime(0, ctx.currentTime+1.2);
  setTimeout(()=>{ oscs.forEach(o=>{ try{o.stop();}catch(e){} }); }, 1400);
  state.ambientNodes = null;
}

/* ---------------- background song ---------------- */
const bgSong = document.getElementById('bg-song');
let songUnlocked = false;
let songFadeIv = null;

/* Called directly inside the click handler of the last button before the
   letter scene. This is a real, fresh user gesture, so browsers allow the
   play() call. Starting play() at volume 0 forces the browser to begin
   fetching song.mp3 immediately. */
function beginSongLoad(){
  if(songUnlocked) return;
  songUnlocked = true;
  bgSong.volume = 0;
  bgSong.load();
  const p = bgSong.play();
  if(p && p.catch) p.catch(()=>{});
}

/* Waits until the song has buffered enough to play smoothly, or gives up
   after maxMs so the experience never hangs on a slow connection. */
function waitForAudioReady(maxMs){
  return new Promise(resolve=>{
    if(bgSong.readyState >= 3){ resolve(); return; }
    let done = false;
    function finish(){
      if(done) return; done = true;
      bgSong.removeEventListener('canplaythrough', finish);
      bgSong.removeEventListener('canplay', finish);
      resolve();
    }
    bgSong.addEventListener('canplaythrough', finish);
    bgSong.addEventListener('canplay', finish);
    setTimeout(finish, maxMs || 6000);
  });
}

function fadeSongIn(target, dur){
  if(songFadeIv) clearInterval(songFadeIv);
  if(state.muted) return;
  bgSong.currentTime = 0;
  if(bgSong.paused){
    const p = bgSong.play();
    if(p && p.catch) p.catch(()=>{});
  }
  const steps = 30; let i = 0;
  songFadeIv = setInterval(()=>{
    i++;
    bgSong.volume = Math.min(target, (target*i/steps));
    if(i >= steps) clearInterval(songFadeIv);
  }, (dur||2500)/steps);
}
function fadeSongOut(dur){
  if(songFadeIv) clearInterval(songFadeIv);
  const startVol = bgSong.volume;
  const steps = 20; let i = 0;
  songFadeIv = setInterval(()=>{
    i++;
    bgSong.volume = Math.max(0, startVol*(1-i/steps));
    if(i >= steps){ clearInterval(songFadeIv); bgSong.pause(); }
  }, (dur||1200)/steps);
}

/* ---------------- draggable shards (heart puzzle) ---------------- */
function makeDraggable(shard, container, onDrop){
  let dragging=false, startX=0, startY=0, origLeft=0, origTop=0, placedFlag=false;
  shard.style.touchAction='none';
  shard.addEventListener('pointerdown', e=>{
    if(placedFlag) return;
    dragging = true;
    try{ shard.setPointerCapture(e.pointerId); }catch(err){}
    startX = e.clientX; startY = e.clientY;
    const rect = shard.getBoundingClientRect();
    const parentRect = container.getBoundingClientRect();
    origLeft = rect.left - parentRect.left;
    origTop = rect.top - parentRect.top;
    shard.style.left = origLeft+'px'; shard.style.top = origTop+'px';
    shard.style.zIndex = 5;
  });
  shard.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    shard.style.left = (origLeft+dx)+'px';
    shard.style.top = (origTop+dy)+'px';
  });
  function release(){
    if(!dragging) return;
    dragging = false;
    const parentRect = container.getBoundingClientRect();
    const shardRect = shard.getBoundingClientRect();
    const cx = shardRect.left + shardRect.width/2 - parentRect.left;
    const cy = shardRect.top + shardRect.height/2 - parentRect.top;
    const tx = parentRect.width/2, ty = parentRect.height/2;
    const dist = Math.hypot(cx-tx, cy-ty);
    if(dist < 60){
      shard.style.left = (tx - shard.offsetWidth/2)+'px';
      shard.style.top = (ty - shard.offsetHeight/2)+'px';
      placedFlag = true;
      onDrop();
    }
  }
  shard.addEventListener('pointerup', release);
  shard.addEventListener('pointercancel', release);
}

async function gamePhoto(){
  await typeLine('Classified Image', {cls:'cyan'});
  await typeLine('File corrupted. Decrypt to view.', {speed:20});
  const frame=document.createElement('div'); frame.className='photo-frame';
  frame.innerHTML = PHOTO_SVG;
  addRaw(frame);
  const range=document.createElement('input');
  range.type='range'; range.min='0'; range.max='100'; range.value='0'; range.className='range-input';
  addRaw(range);
  const caption=document.createElement('div'); caption.className='hint'; caption.style.textAlign='center';
  caption.textContent='drag to decrypt →';
  addRaw(caption);

  const svgEl = frame.querySelector('.photo-svg');
  range.addEventListener('input', ()=>{
    const blurPx = 18 - (range.value/100*18);
    svgEl.style.filter = 'blur('+blurPx+'px)';
  });

  await new Promise(resolve=>{
    function check(){
      if(parseInt(range.value,10) >= 97){ range.removeEventListener('input', check); resolve(); }
    }
    range.addEventListener('input', check);
  });
  await sleep(300);
  await typeLine('Decryption complete.', {cls:'cyan'});
  await typeLine('Owner has viewed this image an unreasonable number of times.', {cls:'big'});
  await sleep(600);
}

async function sceneChapter6(){
  await clearScene();
  await typeLine('CHAPTER SIX', {cls:'dim'});
  await typeLine('Emotional Scan', {cls:'big'});
  await sleep(300);
  await typeLine('Running diagnostics...', {cls:'dim'});
  await sleep(500);

  const scans = [
    {label:'Kindness', value:100},
    {label:'Smile', value:100},
    {label:'Loyalty', value:100},
    {label:'Beauty', value:100, overflow:true, text:'Overflow.'},
    {label:'Ability to make Dave blush', value:92, frozen:true, text:'System frozen.'}
  ];

  for(const s of scans){
    await typeLine('Checking '+s.label+'...', {speed:18});
    const row=document.createElement('div'); row.className='scan-row';
    const lab=document.createElement('div'); lab.className='scan-label';
    const nameSpan=document.createElement('span'); nameSpan.textContent=s.label;
    const pctSpan=document.createElement('span'); pctSpan.textContent='0%';
    lab.appendChild(nameSpan); lab.appendChild(pctSpan);
    const track=document.createElement('div'); track.className='scan-track';
    const fill=document.createElement('div');
    fill.className='scan-fill'+(s.overflow?' overflow':'')+(s.frozen?' frozen':'');
    track.appendChild(fill);
    row.appendChild(lab); row.appendChild(track);
    addRaw(row);
    await sleep(150);
    fill.style.width = s.value+'%';
    pctSpan.textContent = s.overflow ? '127% ⚠' : (s.frozen ? '—' : s.value+'%');
    await sleep(1000);
    if(s.text){
      await sleep(300);
      await typeLine(s.text, {cls: s.frozen ? 'red big' : 'amber'});
      if(s.frozen){ errorTone(); await sleep(700); break; }
    }
    await sleep(300);
  }
  await sleep(700);
}

function spawnPetals(){
  const layer=document.getElementById('petal-layer');
  layer.innerHTML='';
  const syms=['🌹','❤️','✨'];
  for(let i=0;i<16;i++){
    const p=document.createElement('div'); p.className='petal';
    p.textContent = syms[Math.floor(Math.random()*syms.length)];
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (9+Math.random()*10)+'s';
    p.style.animationDelay = (Math.random()*10)+'s';
    p.style.fontSize = (0.8+Math.random()*1.1)+'rem';
    layer.appendChild(p);
  }
}

async function sceneFinalLetter(){
  const appEl = document.getElementById('app');
  const letterScene = document.getElementById('letter-scene');
  const letterWrap = document.getElementById('letter-wrap');
  hideCommandBar();
  await blackTransition(600);
  await waitForAudioReady(4000);
  appEl.style.display = 'none';
  letterWrap.innerHTML = '';
  spawnPetals();
  letterScene.classList.add('show');
  fadeSongIn(0.55, 2000);
  await unblack();

  const h = document.createElement('h2');
  h.textContent = 'One Last File. No Encryption This Time.';
  letterWrap.appendChild(h);
  await sleep(700);

  for(const para of LETTER_PARAGRAPHS){
    await typeLine(para, {cls:'letter-line', speed:32, noSkip:true, tick:false, container:letterWrap, cursorCls:'letter-cursor'});
    await sleep(450);
  }
  await sleep(300);

  const sign = document.createElement('div');
  sign.className = 'letter-line sign enter';
  sign.textContent = 'Forever yours, Dave ❤️';
  letterWrap.appendChild(sign);
  await sleep(1000);

  const statusBox = document.createElement('div');
  statusBox.className = 'status-box enter';
  statusBox.innerHTML =
    '<div><span class="k">Connection:</span> Stable ✅</div>'
    + '<div><span class="k">Trust:</span> Infinite ♾️</div>'
    + '<div><span class="k">Root Access:</span> Permanent 🔐</div>'
    + '<div><span class="k">Chosen User:</span> Phoebe Collins 🌹</div>'
    + '<div style="margin-top:10px">The best thing DaveOS ever found wasn\'t a file…<br>…it was you. ❤️</div>';
  letterWrap.appendChild(statusBox);
  await sleep(900);

  const cont = document.createElement('button');
  cont.className = 'letter-continue';
  cont.textContent = 'continue →';
  letterWrap.appendChild(cont);
  requestAnimationFrame(()=>cont.classList.add('show'));
  await waitForClick(cont);

  stopAmbient();
  fadeSongOut(1500);
  await blackTransition(700);
  letterScene.classList.remove('show');
  appEl.style.display = 'flex';
  await clearScene();
  await unblack();
}

const muteBtn = document.getElementById('mute-btn');
muteBtn.addEventListener('click', ()=>{
  state.muted = !state.muted;
  muteBtn.textContent = state.muted ? '🔇 muted' : '🔊 sound';

    bgSong.pause();
  } else if(document.getElementById('letter-scene').classList.contains('show')){

    fadeSongIn(0.55, 800);

});
